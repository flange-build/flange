# 固件构建工作流：手动触发，在 Docker 容器内构建指定 target 的固件镜像
#
# 完整镜像构建依赖 Docker、需克隆内核/u-boot/ubuntu-base 源码且耗时较长，
# 不适合每次 push 自动运行，故仅提供手动触发（workflow_dispatch）。
# 构建全程经 flange 封装，遵循「不绕过 flange 直接调 docker/make」的项目约束。
name: 构建固件

on:
  workflow_dispatch:
    inputs:
      target:
        description: "lunch target（格式 <board>-<product>-<variant>）"
        required: true
        default: "radxa-cubie-a7a-default-release"
        type: string
      component:
        description: "构建组件（image=完整镜像；亦可填 kernel / bootloader / rootfs 等单组件）"
        required: false
        default: "image"
        type: string

# 同一 target 的重复触发取消尚在运行的旧任务
concurrency:
  group: build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.target }} (${{ inputs.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 嵌入式完整镜像（rootfs + 内核 + bootloader）体积大，
      # 清理 runner 预装的无关软件以腾出磁盘空间
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # rootfs 构建在容器内以 chroot 执行 ARM 二进制（apt-get 等），
      # x86 runner 默认未注册对应 binfmt 模拟器，否则报
      # "chroot: failed to run command 'apt-get': Exec format error"。
      # 该步在宿主内核注册 QEMU（带 fix-binary 标志，chroot 内同样生效）。
      - name: 注册 QEMU binfmt（ARM32 / ARM64 模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      # docker compose 会挂载 ~/.ssh（用于私有源码仓库的 SSH 鉴权），
      # runner 上默认不存在该目录，先创建空目录避免挂载失败
      - name: 准备 SSH 目录
        run: mkdir -p ~/.ssh

      - name: 安装 flange
        run: python -m pip install -e .

      - name: 解析 target
        id: target
        env:
          FLANGE_CI_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PYTHON'
          import os
          from builder.config.query import parse_target
          target = parse_target(os.environ["FLANGE_CI_TARGET"])
          outdir = ".build/target/{board}/{product}/{variant}".format(**target)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in target.items():
                  output.write(f"{key}={value}\n")
              output.write(f"outdir={outdir}\n")
          PYTHON

      - name: 准备 Docker 构建环境
        run: flange docker build

      - name: 构建固件
        env:
          FLANGE_CI_TARGET: ${{ inputs.target }}
          FLANGE_CI_COMPONENT: ${{ inputs.component }}
        run: |
          flange target select "$FLANGE_CI_TARGET"
          flange build "$FLANGE_CI_COMPONENT"

      # 构建失败时输出构建日志，便于排查
      - name: 输出构建日志（失败时）
        if: failure()
        run: |
          log="${{ steps.target.outputs.outdir }}/build.log"
          if [ -f "$log" ]; then
            echo "===== build.log ====="
            tail -n 200 "$log"
          else
            echo "未找到 $log"
          fi

      - name: 上传固件产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.target }}
          path: ${{ steps.target.outputs.outdir }}/
          if-no-files-found: error
          retention-days: 14
