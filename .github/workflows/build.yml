# 固件构建工作流：手动触发，在 Docker 容器内构建指定 target 的固件镜像
#
# 完整镜像构建依赖 Docker、需克隆内核/u-boot/ubuntu-base 源码且耗时较长，
# 不适合每次 push 自动运行，故仅提供手动触发（workflow_dispatch）。
# 构建全程经 flange 封装，遵循「不绕过 flange 直接调 docker/make」的项目约束。
name: 构建固件

on:
  workflow_dispatch:
    inputs:
      target:
        description: "lunch target（格式 <board>-<product>-<variant>）"
        required: true
        default: "radxa-zero3w-default-release"
        type: string
      component:
        description: "构建组件（image=完整镜像；亦可填 kernel / bootloader / rootfs 等单组件）"
        required: false
        default: "image"
        type: string

# 同一 target 的重复触发取消尚在运行的旧任务
concurrency:
  group: build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.target }} (${{ inputs.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 嵌入式完整镜像（rootfs + 内核 + bootloader）体积大，
      # 清理 runner 预装的无关软件以腾出磁盘空间
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # docker compose 会挂载 ~/.ssh（用于私有源码仓库的 SSH 鉴权），
      # runner 上默认不存在该目录，先创建空目录避免挂载失败
      - name: 准备 SSH 目录
        run: mkdir -p ~/.ssh

      - name: 解析 target
        id: target
        run: |
          target="${{ inputs.target }}"
          # 格式 <board>-<product>-<variant>，board 自身可含连字符，
          # 故从右侧依次剥离 variant、product，剩余即 board
          variant="${target##*-}"
          rest="${target%-*}"
          product="${rest##*-}"
          board="${rest%-*}"
          echo "board=$board" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "outdir=.build/target/$board/$product/$variant" >> "$GITHUB_OUTPUT"

      - name: 构建固件
        run: |
          source envsetup.sh
          lunch "${{ inputs.target }}"
          flange build "${{ inputs.component }}"

      # 构建失败时输出构建日志，便于排查
      - name: 输出构建日志（失败时）
        if: failure()
        run: |
          log="${{ steps.target.outputs.outdir }}/build.log"
          if [ -f "$log" ]; then
            echo "===== build.log ====="
            tail -n 200 "$log"
          else
            echo "未找到 $log"
          fi

      - name: 上传固件产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.target }}
          path: ${{ steps.target.outputs.outdir }}/
          if-no-files-found: error
          retention-days: 14
