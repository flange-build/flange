# CI 在 push 与 Pull Request 时运行 Python 功能测试。
# 目标编译、刷写和实机验证分别在 Docker 与对应设备执行。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 同一分支的新提交取消尚在运行的旧任务，节省 Runner 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject.toml 中 requires-python = ">=3.12" 保持一致
        python-version: ["3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # QDL 完整性测试需要实际二进制，不能使用 Git LFS 指针文件。
          lfs: true

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试
        run: pytest
