# CI 工作流：在 push 与 Pull Request 时运行 Python 测试套件
# flange 的构建/刷写依赖 Docker 与硬件，无法在 CI 中执行；
# 这里仅运行不依赖外部环境的 pytest 单元测试（builder / config / platforms）。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 同一分支的新提交取消尚在运行的旧任务，节省 Runner 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject.toml 中 requires-python = ">=3.12" 保持一致
        python-version: ["3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试
        run: pytest
