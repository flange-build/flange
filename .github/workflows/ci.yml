# CI 在 push 与 Pull Request 时运行 Python 与 Rust 功能测试。
# 目标编译、刷写和实机验证分别在 Docker 与对应设备执行。
name: CI

on:
  push:
    branches:
      - main
  pull_request:

# 同一分支的新提交取消尚在运行的旧任务，节省 Runner 资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject.toml 中 requires-python = ">=3.12" 保持一致
        python-version: ["3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # QDL 完整性测试需要实际二进制，不能使用 Git LFS 指针文件。
          lfs: true

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 运行测试
        run: pytest

  usbmoded:
    name: usbmoded (Rust / ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [armhf, aarch64]
    steps:
      - name: 安装容器编译依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 build-essential ca-certificates git xz-utils

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 测试并交叉编译静态 USB 服务
        working-directory: components/app/usbmoded
        env:
          FLANGE_TARGET_ARCH: ${{ matrix.arch }}
          FLANGE_BUILD_ROOT: ${{ runner.temp }}/usbmoded-build
          FLANGE_APP_WORK_DIR: ${{ runner.temp }}/usbmoded-build/work
          DESTDIR: ${{ runner.temp }}/usbmoded-build/install
        # 与 App 构建共用固定摘要工具链、Cargo.lock、格式检查及原生回归测试。
        run: python3 build.py
