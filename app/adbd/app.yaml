app:
  name: adbd
  version: 1.0.0
  description: Android Debug Bridge daemon，通过 USB gadget 提供 adb 调试通道
  type: service
  arch:
    - aarch64
    - armhf

maintainer:
  name: flange
  email: flange@localhost

capabilities:
  - usb-gadget
  - adb-debug

install:
  bin/adbd-arm64: /usr/bin/adbd
  conf/usbdevice.conf: /etc/usbdevice.conf
  scripts/usbdevice: /usr/sbin/usbdevice
  udev/61-usbdevice.rules: /etc/udev/rules.d/61-usbdevice.rules

systemd:
  unit: systemd/usbdevice.service
  auto_start: true

depends:
  - libc6

conffiles:
  - /etc/usbdevice.conf

data_dirs: []
