# meson cross-file —— aarch64 (arm64) target
#
# 与 docker/Dockerfile 内通过 apt 安装的 gcc-aarch64-linux-gnu 工具链对应；
# 由 docker/Dockerfile 通过 COPY 投放到容器内 /etc/meson/cross-aarch64.ini，
# 与 builder/app.py 中 _BUILD_SYSTEMS["meson"] 模板引用的路径保持一致。
#
# 本文件仅声明 [binaries] 与 [host_machine]，不固化 cflags/ldflags；
# 优化级别、sysroot 等可调参数由各 app 的 meson.build 或 build.options 决定。

[binaries]
c          = 'aarch64-linux-gnu-gcc'
cpp        = 'aarch64-linux-gnu-g++'
ar         = 'aarch64-linux-gnu-ar'
strip      = 'aarch64-linux-gnu-strip'
ld         = 'aarch64-linux-gnu-ld'
objcopy    = 'aarch64-linux-gnu-objcopy'
pkg-config = 'aarch64-linux-gnu-pkg-config'

[host_machine]
system     = 'linux'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
