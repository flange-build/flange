# meson cross-file —— armhf (32-bit ARM hard-float) target
#
# 与 docker/Dockerfile 内通过 apt 安装的 gcc-arm-linux-gnueabihf 工具链对应；
# 由 docker/Dockerfile 通过 COPY 投放到容器内 /etc/meson/cross-armhf.ini。
#
# 本文件仅声明 [binaries] 与 [host_machine]，不固化 cflags/ldflags；
# 优化级别、sysroot 等可调参数由各 app 的 meson.build 或 build.options 决定。

[binaries]
c          = 'arm-linux-gnueabihf-gcc'
cpp        = 'arm-linux-gnueabihf-g++'
ar         = 'arm-linux-gnueabihf-ar'
strip      = 'arm-linux-gnueabihf-strip'
ld         = 'arm-linux-gnueabihf-ld'
objcopy    = 'arm-linux-gnueabihf-objcopy'
pkg-config = 'arm-linux-gnueabihf-pkg-config'

[host_machine]
system     = 'linux'
cpu_family = 'arm'
cpu        = 'armv7hf'
endian     = 'little'
