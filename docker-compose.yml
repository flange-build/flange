services:
  build:
    image: flange-build
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      # 项目目录挂载到容器
      - .:/workspace
      # Bazel output base 持久化
      - ./output/bazel:/workspace/output/bazel
      # SSH 密钥（用于拉取私有 git 仓库）
      - ~/.ssh:/root/.ssh:ro
    working_dir: /workspace
