services:
  build:
    build:
      context: .
      dockerfile: docker/Dockerfile
    privileged: true
    volumes:
      # 项目目录挂载到容器
      - .:/workspace
      # 源码仓库持久化
      - ./sources:/workspace/sources
      # APT 下载缓存持久化
      - ./cache/apt:/cache/apt
      # SSH 密钥（挂载到临时位置，entrypoint 复制并修正权限）
      - ~/.ssh:/tmp/.ssh-host:ro
    working_dir: /workspace
