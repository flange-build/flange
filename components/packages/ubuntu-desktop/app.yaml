app:
  name: flange-ubuntu-desktop-config
  version: 1.0.6
  description: GNOME 原生外观、常亮、Remote Login 与 Snap 应用配置
  type: service
  arch: [aarch64]

maintainer:
  name: flange
  email: flange@localhost

build:
  system: none

install:
  schemas/99_flange-gnome.gschema.override: /usr/share/glib-2.0/schemas/99_flange-gnome.gschema.override
  systemd/99-flange-no-sleep.conf: /etc/systemd/sleep.conf.d/99-flange-no-sleep.conf

systemd:
  unit: systemd/flange-configure-ubuntu-desktop.service
  auto_start: true

depends:
  - gnome-core
  - glmark2-wayland
  - language-pack-zh-hans
  - language-pack-gnome-zh-hans
  - fonts-noto-cjk
  - gnome-remote-desktop
  - chromium-browser
  - snapd
  - openssl

data_dirs: []
