app:
  name: rkmm-gst-base
  version: 1.0.0
  description: GStreamer base 插件集
  type: staging
  arch: [aarch64]

maintainer:
  name: flange
  email: flange@localhost

build:
  system: custom
  commands:
    - [python3, ../../lib/unit.py, rkmm-gst-base]
  staging: stage
  deps:
    - rkmm-gstreamer
  apt_packages:
    - bison
    - cmake
    - dpkg-dev
    - flex
    - git
    - iso-codes
    - libasound2-dev:{arch}
    - libcairo2-dev:{arch}
    - libcdparanoia-dev:{arch}
    - libdrm-dev:{arch}
    - libegl-dev:{arch}
    - libflac-dev:{arch}
    - libgbm-dev:{arch}
    - libgl-dev:{arch}
    - libgles-dev:{arch}
    - libglib2.0-dev:{arch}
    - libgraphene-1.0-dev:{arch}
    - libgudev-1.0-dev:{arch}
    - libjpeg-dev:{arch}
    - libjson-glib-dev:{arch}
    - libnice-dev:{arch}
    - libogg-dev:{arch}
    - libopus-dev:{arch}
    - liborc-0.4-dev:{arch}
    - libpango1.0-dev:{arch}
    - libpng-dev:{arch}
    - libpulse-dev:{arch}
    - libsoup-3.0-dev:{arch}
    - libsrtp2-dev:{arch}
    - libssl-dev:{arch}
    - libtheora-dev:{arch}
    - libvisual-0.4-dev:{arch}
    - libvorbis-dev:{arch}
    - libv4l-dev:{arch}
    - libwayland-dev:{arch}
    - libx11-dev:{arch}
    - libxext-dev:{arch}
    - libxml2-dev:{arch}
    - libxv-dev:{arch}
    - meson
    - nasm
    - ninja-build
    - patch
    - wayland-protocols
    - xz-utils
