app:
  name: usbmoded
  version: 1.1.0
  description: USB gadget 管理服务 —— gadget 核心层 + 原子能力层 + 场景层，提供运行时 USB 工作模式切换与 device/host 角色切换
  type: service
  arch:
    - aarch64
    - armhf

maintainer:
  name: flange
  email: flange@localhost

build:
  system: custom
  commands:
    - [python3, build.py]

install:
  # 构建产物为静态 Rust ELF，musl 与 glibc 目标共用，无解释器依赖。
  out/usbmoded: /usr/sbin/usbmoded
  out/usb-mode: /usr/sbin/usb-mode

  # 配置。conf/ 的约定路径是 /etc/<app名>/，这里正好是 /etc/usbmode/，
  # 但显式声明以免将来 App 改名时配置路径跟着漂。
  conf/usbmode/gadget.d/10-default.yaml: /etc/usbmode/gadget.d/10-default.yaml
  conf/usbmode/scenes.d/10-common.yaml: /etc/usbmode/scenes.d/10-common.yaml

  # udev 规则。约定路径为 /lib/udev/rules.d/，覆盖到 /etc 便于板级调试时修改。
  udev/61-usbmode.rules: /etc/udev/rules.d/61-usbmode.rules

systemd:
  # 主服务。usbmoded-mtp-server.service 经 systemd/ 约定目录一并安装，但不
  # enable —— 它的启停由 usbmoded 的 mtp 能力驱动。注意该 unit 依赖系统提供
  # mtp-server 二进制，本 App 不提供；缺失时 mtp 能力会在启动 unit 时报错。
  unit: systemd/usbmoded.service
  auto_start: true

openrc:
  # OpenRC 目标（Alpine）的同一服务；只打包目标 init 对应的服务文件。
  # udev 规则经 scripts/notify（→ /usr/lib/usbmoded/notify）按 init 发 reload。
  script: openrc/usbmoded
  auto_start: true

packaging:
  depends:
    apk: [eudev]

depends:
  - udev

conffiles:
  - /etc/usbmode/gadget.d/10-default.yaml
  - /etc/usbmode/scenes.d/10-common.yaml

data_dirs: []
