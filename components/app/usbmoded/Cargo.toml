[package]
name = "usbmoded"
version = "1.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
