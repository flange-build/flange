# fan_control.conf — 温控风扇配置文件
#
# 此为 App 默认配置（通用 fallback 值）。
# 不同板子的 GPIO/阈值不同，板级 overlay 应覆盖此文件：
#   board/<board>/overlay/etc/fan_control.conf
#
# 格式: KEY=VALUE（shell source 格式）

# 风扇 GPIO 全局编号 = bank*32 + bank 内偏移
#   bank 内偏移：A0..A7=0~7, B0..B7=8~15, C0..C7=16~23, D0..D7=24~31
#   例：GPIO3_B6 → bank=3, B6=8+6=14 → 3*32+14 = 110
FAN_GPIO=110

# 有效电平：high=高电平开风扇（写 1 转），low=低电平开风扇（写 0 转）
FAN_ACTIVE=high

# 开/关温度阈值（单位：毫摄氏度，匹配 /sys/class/thermal/*/temp）
# 两者之差即滞回区间，避免临界点频繁开关
TEMP_ON=55000     # 所有 thermal zone 最高温 ≥ 此值 → 开风扇
TEMP_OFF=45000    # 所有 thermal zone 最高温 ≤ 此值 → 关风扇

# 采样周期（秒）
INTERVAL=5
