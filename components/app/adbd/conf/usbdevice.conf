# usbdevice.conf — USB gadget 配置文件
#
# 此为 App 默认配置（通用 fallback 值）。
# 实际使用时，板级 overlay 应提供平台特定的配置覆盖此文件：
#   board/<board>/overlay/etc/usbdevice.conf
#
# 格式: KEY=VALUE（shell source 格式）

# USB Vendor ID（默认为 Linux Foundation 的测试 VID）
USB_VENDOR_ID=0x1d6b

# USB 产品名（宿主机 lsusb 显示的产品名）
USB_PRODUCT_NAME="linux-gadget"

# USB 厂商名
USB_MANUFACTURER="linux"

# configfs gadget group 名称
USB_GROUP=linux

# 启用的 USB function 列表（空格分隔）
# 可选值: adb, mtp, ums, uvc, hid, acm, rndis, ntb
# 扩展 function 需要在 /etc/usbdevice.d/ 中提供实现
USB_FUNCS=adb

# 序列号来源:
#   cpuinfo  — 从 /proc/cpuinfo 的 Serial 字段读取
#   random   — 随机生成
#   <其他>   — 直接作为序列号使用
USB_SERIAL_SOURCE=cpuinfo

# USB 设备描述符
USB_BCD_DEVICE=0x0310
USB_BCD_USB=0x0200
USB_MAX_POWER=500

# Product ID 映射表
# 格式: USB_PID_<function组合>=<pid>
# function 组合按字母排序、下划线连接
# 例如: adb + mtp → USB_PID_adb_mtp
USB_PID_adb=0x0006
USB_PID_DEFAULT=0x0019

# adb shell 使用的 shell（ADB 36 standalone adbd 读取；旧 vendor adbd 忽略，
# 固定用 /bin/sh）。adbd 交互模式以 argv[0]="-/bin/bash" 启动 —— 即 login
# shell，读 /etc/profile 与 /root/.bashrc，得到与 ssh 登录一致的提示符、
# 补全与历史体验。
export ADBD_SHELL=/bin/bash

# adbd TCP 调试端口（ADB 36 standalone adbd 需显式指定；旧 vendor adbd
# 内建监听 5555、不读此变量）
export ADB_TCP_PORT=5555
