# Console 安静策略（base rootfs，所有板生效）：systemd-sysctl.service 在
# sysinit 早期 apply 本设置后，仅 KERN_EMERG (level 0) 上 console，其他
# 级别静默到 ring buffer（dmesg / journal 仍能查全量）。
#
# 适用阶段：systemd-sysctl.service 在 sysinit.target 早期生效；kernel boot
# 期（apply 之前）仍按 cmdline `loglevel=4` 输出关键 boot 信息，不被吞。
# 系统起来后无新增 printk 上 console。
#
# 触发动机：vendor BSP driver 习惯把"运行时持续状态"按 KERN_ERR 报，
# kernel cmdline `loglevel=4` 压不住（3 < 4 会上 console），降 cmdline 到 3
# 又会吞其他 driver 真实 ERR（mmc / disk / oom）；改用 runtime sysctl 抬
# console_loglevel 到 1。已知触发点：
#   - orangepi-5-plus 板 HDMI RX driver rk_hdmirx.c:1685 在无 HDMI 输入源
#     时 v4l2_err "HDMI pull out, return!" 每秒数次刷 ttyFIQ0/ttyS2
#   - radxa-rock5b 板 rkwifibt RTL8852BE PHL/RTW driver 启动后持续 print
#     KERN_INFO/DEBUG，cmdline 提升 loglevel 调试时同样淹没 console
# 适配后这类 spam 全部进 ring buffer，console 干净。
#
# kernel.printk 4 字段（int）：
#   1: console_loglevel        — 仅 level < 此值的 printk 上 console
#   2: default_message_loglevel — 不带 KERN_* 的 printk 默认 level
#   3: minimum_console_loglevel — console_loglevel 不可低于此
#   4: default_console_loglevel — boot 期默认（由 cmdline 覆盖）
#
# rollback：删本文件重启，或 runtime `sysctl -w kernel.printk="4 4 1 7"`。
# 某块板需要更宽松 console（如调试期）可在 board overlay 写
# /etc/sysctl.d/20-console-debug.conf 设回 `4 4 1 7`，编号 20 > 10 覆盖
# 本文件。
kernel.printk = 1 4 1 7
