# Console 安静策略：仅 KERN_EMERG (level 0) 上 console；其他级别全部
# 静默到 dmesg/journal（仍可查）。
#
# 适用阶段：systemd-sysctl.service 在 sysinit.target 早期 apply 本设置；
# kernel boot 期（apply 之前）仍按 cmdline `loglevel=4` 输出，关键 boot
# 信息不被吞。系统起来后再无新增 printk 上 console。
#
# 触发：板载 HDMI RX overlay（commit 7a54990 启用）driver
# rk_hdmirx.c:1685 在无 HDMI 输入源时调 v4l2_err（KERN_ERR=3）报
# "HDMI pull out, return!" 每秒数次刷 ttyFIQ0/ttyS2。kernel cmdline
# loglevel=4 压不住（3 < 4 会上 console）；降 cmdline 到 3 会吞其他
# driver 真实 ERR（mmc/disk/oom），不行。改用 runtime sysctl 把
# console_loglevel 抬到 1，spam 进 ring buffer 不进 console，dmesg
# 仍能查。
#
# kernel.printk 4 字段（int）：
#   1: console_loglevel        — 仅 level < 此值的 printk 上 console
#   2: default_message_loglevel — 不带 KERN_* 的 printk 默认 level
#   3: minimum_console_loglevel — console_loglevel 不可低于此
#   4: default_console_loglevel — boot 期默认（由 cmdline 覆盖）
#
# rollback：删本文件 + 重启，或 `sysctl -w kernel.printk="4 4 1 7"`。
#
# 如其他板（rock5b PHL/RTW、rp-pro-rk3568-h 类似 vendor driver spam）
# 复发同类问题，可把本文件上提到 components/rootfs/overlay/ 走 base
# rootfs，惠及所有板；目前先 board-local 保留聚焦。
kernel.printk = 1 4 1 7
