# usbdevice.conf — Khadas VIM3（Amlogic A311D）板级 ADB gadget 配置
# 0x18d1 使用 host adb 的通用规则；0x1b8e 留给 Amlogic MaskROM 阶段。
USB_VENDOR_ID=0x18d1
USB_PRODUCT_NAME="khadas-vim3"
USB_MANUFACTURER="khadas"
USB_GROUP=khadas-vim3
USB_FUNCS=adb
USB_SERIAL_SOURCE=cpuinfo

USB_BCD_DEVICE=0x0310
USB_BCD_USB=0x0200
USB_MAX_POWER=500

USB_PID_adb=0xd001
USB_PID_DEFAULT=0xd002

# ADB 36 standalone adbd 需要显式 TCP 端口和 shell。
export ADB_TCP_PORT=5555
export ADBD_SHELL=/bin/bash
