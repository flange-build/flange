# usbdevice.conf — NanoPi NEO (Allwinner H3) 平台配置
#
# NanoPi NEO 的 micro USB 口在 mainline dts（sun8i-h3-nanopi-neo.dts）中
# dr_mode 锁定为 "peripheral"，D+/D- 接到 H3 的 usb_otg (MUSB) 控制器，
# 硬件层面已确认可运行 USB gadget（详见 design.md 决策 8）。

# Allwinner Technology 官方 USB Vendor ID
USB_VENDOR_ID=0x1f3a

# 产品名
USB_PRODUCT_NAME="nanopi-neo"

# 厂商名
USB_MANUFACTURER="Allwinner"

# configfs gadget group 名称（与 A733 平台的 "sunxi" 区分，避免历史上
# 误将两个不同 Allwinner 平台的 gadget 配置混用时难以排查）
USB_GROUP=sunxi-h3

# 默认启用 adb
USB_FUNCS=adb

# 序列号从 /proc/cpuinfo 读取
USB_SERIAL_SOURCE=cpuinfo

# USB 设备描述符
USB_BCD_DEVICE=0x0310
USB_BCD_USB=0x0200
USB_MAX_POWER=500

# Product ID 映射表
USB_PID_adb=0x0006
USB_PID_DEFAULT=0x0019
