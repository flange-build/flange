# mainline kernel 6.12 把 USB gadget framework 编成模块（=m），usbdevice
# 脚本期望 /sys/kernel/config/usb_gadget/ 目录存在（libcomposite 加载后
# 由 configfs 自动建）。systemd-modules-load.service 在启动早期读 modules-
# load.d/*.conf 把这些模块 modprobe 上来。
#
# 不显式 modprobe 会导致 components/app/adbd/scripts/usbdevice 的
# ``mkdir -p $USB_GADGET_DIR`` 静默成功但子目录创建失败，下一步
# ``mkdir functions/ffs.adb`` 报 "Failed to create instance: ffs.adb"
# （实测 mainline 6.12 + VIM3L，Radxa Zero 同栈）。
#
# rockchip / allwinner BSP kernel 一般把 libcomposite 编 builtin（=y），
# 不需要这一步；本配置 amlogic mainline 板（VIM3L / Radxa Zero）用。
libcomposite
