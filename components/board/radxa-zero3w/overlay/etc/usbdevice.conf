# usbdevice.conf — Rockchip RK3566 (Radxa Zero 3W) 平台配置
#
# 此文件由板级 overlay 提供，覆盖 App 默认配置。

# Rockchip USB Vendor ID
USB_VENDOR_ID=0x2207

# 产品名
USB_PRODUCT_NAME="radxa-zero3w"

# 厂商名
USB_MANUFACTURER="rockchip"

# configfs gadget group 名称
USB_GROUP=rockchip

# 默认启用 adb
USB_FUNCS=adb

# 序列号从 /proc/cpuinfo 读取
USB_SERIAL_SOURCE=cpuinfo

# USB 设备描述符
USB_BCD_DEVICE=0x0310
USB_BCD_USB=0x0200
USB_MAX_POWER=500

# Rockchip Product ID 映射表
USB_PID_adb=0x0006
USB_PID_mtp=0x0001
USB_PID_adb_mtp=0x0011
USB_PID_ums=0x0000
USB_PID_adb_ums=0x0018
USB_PID_adb_uvc=0x0015
USB_PID_acm=0x1005
USB_PID_DEFAULT=0x0019

# ⚠ 注意：本文件在构建时整文件覆盖 App 层 conf（overlay 优先级最高），
# App 层新增的配置键必须在此手动跟进，否则默默丢失。

# adbd TCP 调试端口。ADB 36 standalone adbd 需显式指定；
# 旧 vendor adbd 内建监听 5555、不读此变量
export ADB_TCP_PORT=5555

# adb shell 使用 login bash，与 ssh 登录体验一致
export ADBD_SHELL=/bin/bash
