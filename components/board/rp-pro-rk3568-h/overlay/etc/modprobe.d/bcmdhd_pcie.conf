# bcmdhd_pcie OOT 模块固件路径重定向
#
# rkwifibt drivers/bcmdhd 编译期硬编码默认 firmware/nvram 路径为 Android vendor
# 路径 /vendor/etc/firmware/，标准 Linux rootfs 上不存在；driver 走自身
# vfs_open 读绝对路径，**不**经内核 firmware_class（dts chosen.bootargs 里
# firmware_class.path 对它无效）。
#
# dhd_config.c 的 dhd_conf_set_path_params 只取 firmware_path / nvram_path 的
# 目录前缀，文件名按 chip 表 (BCM43752A2 PCIe → fw_bcm43752a2_pcie_ag.bin /
# nvram_ap6275p.txt / clm_bcm43752a2_pcie_ag.blob / config.txt) 自动替换。
# 一行重定向同时纠正 fw / clm / nvram / conf 四个文件路径。
options bcmdhd_pcie firmware_path=/lib/firmware/fw_bcmdhd.bin nvram_path=/lib/firmware/nvram.txt
