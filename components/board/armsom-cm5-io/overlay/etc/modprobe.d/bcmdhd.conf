# ArmSoM CM5 IO (BW3752-50B1 / BCM43752 / AP6275S) — rkwifibt OOT bcmdhd 固件路径
#
# rkwifibt 的 OOT bcmdhd 编译默认 CONFIG_BCMDHD_FW_PATH=/vendor/etc/firmware/
# （Android 路径，Makefile 438-443），而 flange 把固件部署到标准
# /lib/firmware/brcm/。bcmdhd 经 udev SDIO MODALIAS 自动 modprobe 时读本文件，
# 用 module param 把固件/nvram 路径覆盖到 /lib/firmware/brcm/。
#
# 给通用名 fw_bcmdhd.bin / nvram.txt，bcmdhd CONFIG_BCMDHD_AUTO_SELECT 按 chip
# id(0xaae8=BCM43752 rev2) 自动拼成实际文件名 fw_bcm43752a2_ag.bin /
# nvram_ap6275s.txt，clm 从 fw 同目录推导 clm_bcm43752a2_ag.blob——三者均命中
# extra_firmware 部署的文件。实机实测：country CN 成功、扫到 2.4G+5G AP。
options bcmdhd firmware_path=/lib/firmware/brcm/fw_bcmdhd.bin nvram_path=/lib/firmware/brcm/nvram.txt
