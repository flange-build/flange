# usbdevice.conf — Khadas VIM3L (Amlogic S905D3) 板级配置
#
# 覆盖 components/app/adbd/conf/usbdevice.conf 的通用 fallback。
# VID/PID 选取理由：
#   - 0x18d1 = Google Android Open Source Project VID。host 端 adb 工具
#     默认 udev rule 包含此 VID，host 不需要额外配置即可识别。Khadas
#     vendor distro 也用同款（兼容性最好）。
#   - 不用 0x1b8e（Amlogic MaskROM VID）—— 那是 BootROM USB Burning 阶
#     段占用，Linux gadget 阶段复用会和 flange flash 路径混淆。
#   - PID 0xd001 是 Google 通用 adb-only 组合的常见值；多 function 组
#     合（USB_PID_adb_mtp 等）当前不启用。

# Google Android VID（host adb 默认识别）
USB_VENDOR_ID=0x18d1

# 产品名
USB_PRODUCT_NAME="khadas-vim3l"

# 厂商名
USB_MANUFACTURER="khadas"

# configfs gadget group 名称
USB_GROUP=khadas-vim3l

# 默认启用 adb（usb_f_fs FunctionFS 路径）
USB_FUNCS=adb

# 序列号从 /proc/cpuinfo Serial 字段读取（Amlogic S905D3 BootROM 写入）
USB_SERIAL_SOURCE=cpuinfo

# USB 设备描述符
USB_BCD_DEVICE=0x0310
USB_BCD_USB=0x0200
USB_MAX_POWER=500

# Product ID 映射表
# 格式: USB_PID_<function组合>=<pid>
# function 组合按字母排序、下划线连接
USB_PID_adb=0xd001
USB_PID_DEFAULT=0xd002

# ⚠ 注意：本文件在构建时整文件覆盖 App 层 conf（overlay 优先级最高），
# App 层新增的配置键必须在此手动跟进，否则默默丢失。

# adbd TCP 调试端口。ADB 36 standalone adbd 需显式指定；
# 旧 vendor adbd 内建监听 5555、不读此变量
export ADB_TCP_PORT=5555

# adb shell 使用 login bash，与 ssh 登录体验一致
export ADBD_SHELL=/bin/bash
