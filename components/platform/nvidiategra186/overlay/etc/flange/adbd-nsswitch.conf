# flange：只供 adbd 使用的 NSS 配置（由 usbmoded-adbd.service 绑定到其挂载命名空间的 /etc/nsswitch.conf）。
# adbd 静态链接 glibc 2.39，只能使用 libc 内置的 files / dns；18.04 默认的 compat / db 会让它
# dlopen glibc 2.27 的 NSS 模块，触发 _dl_call_libc_early_init 断言后 abort。
passwd:         files
group:          files
shadow:         files
gshadow:        files

hosts:          files dns
networks:       files

protocols:      files
services:       files
ethers:         files
rpc:            files
