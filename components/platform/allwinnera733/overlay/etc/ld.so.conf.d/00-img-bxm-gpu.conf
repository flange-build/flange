# IMG PowerVR BXM GPU DDK 用户态库优先路径
#
# xserver-xorg-img-bxm deb（见 platform/allwinnera733/a733/config.py 的
# extra_debs）把 PVR 的 libEGL/libGLESv2/libGLESv1_CM/libgbm 等装到
# /usr/local/lib。该装 weston 等合成器时，apt 会顺带拉入 Mesa/glvnd 的同名
# libEGL.so.1 / libgbm.so.1（位于多架构目录 /usr/lib/aarch64-linux-gnu，由
# aarch64-linux-gnu.conf 注册）。ldconfig 按 ld.so.conf.d 文件名字典序扫描，
# 同 soname 先扫到的目录胜出——本文件以 00- 前缀排在 aarch64-linux-gnu.conf
# 之前，确保 PVR 库优先于 Mesa/glvnd，否则 EGL 会回退到 llvmpipe 软件渲染。
#
# vendor 原以 /etc/environment 里 `export LD_LIBRARY_PATH=...:/usr/local/lib`
# 试图解决，但 /etc/environment 不做变量展开/不被 systemd 读取，对开机自启的
# weston service 无效，故改用此 ld.so.conf.d 接线（a7a / a7z 经平台层共享）。
/usr/local/lib
